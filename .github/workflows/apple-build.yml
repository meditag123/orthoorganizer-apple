name: Apple build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS simulator and macOS targets
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: OrthoOrganizerApple
        run: xcodegen generate

      - name: Build iOS simulator target
        working-directory: OrthoOrganizerApple
        run: |
          set -o pipefail
          xcodebuild \
            -project OrthoOrganizerApple.xcodeproj \
            -scheme OrthoOrganizerApple \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            build | tee ../ios-build.log

      - name: Package iOS simulator app
        working-directory: OrthoOrganizerApple
        run: |
          set -euo pipefail
          app_path="build-ios/Build/Products/Release-iphonesimulator/OrthoOrganizerApple.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ../OrthoOrganizerSimulator.zip

      - name: Upload iOS simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrthoOrganizerSimulator
          path: OrthoOrganizerSimulator.zip
          retention-days: 14

      - name: Build macOS target
        working-directory: OrthoOrganizerApple
        run: |
          set -o pipefail
          xcodebuild \
            -project OrthoOrganizerApple.xcodeproj \
            -scheme OrthoOrganizerMac \
            -sdk macosx \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build | tee ../macos-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-logs
          path: |
            ios-build.log
            macos-build.log
