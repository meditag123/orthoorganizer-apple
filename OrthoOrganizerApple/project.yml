name: OrthoOrganizerApple
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: 1.10.0
targets:
  OrthoOrganizerApple:
    type: application
    platform: iOS
    sources:
      - path: Sources/OrthoOrganizerAppleApp
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoorganizer.apple
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleDisplayName: OrthoOrganizer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Χρησιμοποιείται για ασφαλές ξεκλείδωμα του OrthoOrganizer."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/OrthoOrganizer.entitlements
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: CryptoSwift
        product: CryptoSwift
      - target: OrthoOrganizerWidget

  OrthoOrganizerMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/OrthoOrganizerAppleApp
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoorganizer.apple.mac
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleDisplayName: OrthoOrganizer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/OrthoOrganizer.entitlements
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: CryptoSwift
        product: CryptoSwift
      - target: OrthoOrganizerMacWidget

  OrthoOrganizerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/OrthoOrganizerWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoorganizer.apple.widget
        INFOPLIST_KEY_CFBundleDisplayName: OrthoOrganizer Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Resources/OrthoOrganizerWidget.entitlements

  OrthoOrganizerMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/OrthoOrganizerWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoorganizer.apple.mac.widget
        INFOPLIST_KEY_CFBundleDisplayName: OrthoOrganizer Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Resources/OrthoOrganizerWidget.entitlements
